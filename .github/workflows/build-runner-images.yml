# Builds the runner images in images/ (every runner-* folder), smoke-tests
# each one, pushes it, and prunes old versions. images/README.md says what
# each image is for and how to bump or add a tool.
#
# Published to GHCR, at ghcr.io/<repo owner>. Each image is built by
# build-image.yml, the one file a fork replaces to build on its own runners
# into its own registry; a fork switches this workflow on with the repository
# variable RUNNER_IMAGES_BUILD=true. README: "Your own images".
#
# Twice a month (about every 15 days), and on demand ("Run workflow") after a
# bump. Each run:
#   1. moves the base to the newest actions/runner release at least 14 days
#      old (the two-week rule in images/README.md), by tag and digest, in all
#      four Dockerfiles, and commits that when it changed;
#   2. tags the commit it builds <YYYY.MM.DD>, so every published image has
#      its source tagged;
#   3. builds, smoke-tests and pushes from that tag;
#   4. once every image is pushed, makes the GitHub release for the tag, with
#      the digests.
# Tools stay pinned in images/common/versions.env, so a run with no base
# change still proves every pinned download is there and matches its
# checksum.
#
# Tags: <YYYY.MM.DD> and <YYYY.MM.DD>-<shortsha>. There is no "latest", on
# purpose: clients pin an image by digest, and a moving tag would invite
# unpinned use that changes under a running estate. The date tag moves if the
# same day is built twice; the digest never does.
name: build-runner-images

on:
  workflow_dispatch:
  schedule:
    # Wanted: the 15th, and the 30th or the last day of February. Cron can't
    # say "30th, or the 28th/29th in February", so this fires on all four
    # days and the decide job keeps the right ones (images/common/build-day.sh).
    # 04:00 UTC, clear of the top-of-the-hour rush when GitHub drops runs.
    - cron: "0 4 15,28,29,30 * *"

permissions:
  contents: read

# The base commit and tag are pushed with the workflow's own token, so main
# must let github-actions push (no rule requiring a pull request for it).
# A manual run on a build day shouldn't race the scheduled one for the same
# tags.
concurrency:
  group: build-runner-images
  cancel-in-progress: false

jobs:
  decide:
    # This repo, or a fork that has switched it on.
    if: github.repository == 'gitopsmanager/runner-images' || vars.RUNNER_IMAGES_BUILD == 'true'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.day.outputs.build }}
      date_tag: ${{ steps.day.outputs.date_tag }}
      images: ${{ steps.day.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the build-day rule
        run: bash images/common/test-build-day.sh

      # One base for all of them is the point (one toolchain); copies of the
      # FROM line can drift on a bump, so refuse that here.
      - name: Check every image has the same base
        run: |
          grep -H '^FROM ghcr.io/actions/actions-runner:' images/runner-*/Dockerfile
          if [ "$(grep -h '^FROM ghcr.io/actions/actions-runner:' images/runner-*/Dockerfile | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::images/runner-*/Dockerfile don't all use the same base FROM line"
            exit 1
          fi

      - id: day
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            build=true
          else
            build=$(bash images/common/build-day.sh)
          fi
          # The image list is here once; the build and summary jobs read it.
          images=""
          for d in images/runner-*/; do images="$images\"$(basename "$d")\","; done
          images="[${images%,}]"
          {
            echo "build=$build"
            echo "date_tag=$(date -u +%Y.%m.%d)"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"
          if [ "$build" != true ]; then
            echo "$(date -u +%F) is not a build day (the 15th, the 30th, or the last day of February). Nothing built." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "event=$EVENT build=$build images=$images"

  # The base image, the commit and the tag the build runs from.
  base:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
      base: ${{ steps.pick.outputs.base }}
    env:
      DATE_TAG: ${{ needs.decide.outputs.date_tag }}
    steps:
      - uses: actions/checkout@v7

      # The commit and the annotated tag both need an author, whether or not
      # the base changed.
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Newest runner release at least 14 days old
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/actions/runner/releases?per_page=30" --jq '
            [.[] | select(.draft == false and .prerelease == false
                          and (.published_at | fromdateiso8601) <= (now - 14*86400))]
            | first | .tag_name' | sed 's/^v//')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No runner release at least 14 days old found"; exit 1; }

          # The index digest: it covers every architecture.
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:actions/actions-runner:pull" | jq -r .token)
          digest=$(curl -fsSI -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/actions/actions-runner/manifests/$version" |
            tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No digest for actions-runner:$version"; exit 1; }

          base="ghcr.io/actions/actions-runner:$version@$digest"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base: $base"

      - name: Move the Dockerfiles onto it
        env:
          BASE: ${{ steps.pick.outputs.base }}
        run: |
          set -euo pipefail
          # Only the base line; the rest of the line (" AS image") stays.
          line() { grep -h '^FROM ghcr.io/actions/actions-runner:' images/runner-*/Dockerfile | awk '{print $2}' | sort -u; }
          current="FROM $(line)"
          if [ "$current" = "FROM $BASE" ]; then
            echo "Already on $BASE."
            exit 0
          fi
          for f in images/runner-*/Dockerfile; do
            sed -i -E "s|^FROM ghcr\.io/actions/actions-runner:[^ ]+|FROM $BASE|" "$f"
          done
          [ "$(line)" = "$BASE" ] || { echo "::error::A Dockerfile's base FROM line was not updated"; exit 1; }
          git commit -q -am "Base: ${BASE%@*}" -m "From ${current#FROM }"
          git push -q origin HEAD:main
          echo "Moved from ${current#FROM } to $BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag what is built
        id: tag
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          existing=$(git ls-remote --tags origin "refs/tags/$DATE_TAG^{}" | cut -f1)
          if [ -n "$existing" ]; then
            # A second run the same day: fine on the same commit, refused on another.
            [ "$existing" = "$sha" ] || { echo "::error::Tag $DATE_TAG already exists on another commit ($existing)"; exit 1; }
            echo "Tag $DATE_TAG already on $sha."
          else
            git tag -a "$DATE_TAG" -m "Runner images $DATE_TAG"
            git push -q origin "refs/tags/$DATE_TAG"
          fi
          { echo "sha=$sha"; echo "short_sha=${sha::7}"; } >> "$GITHUB_OUTPUT"

  # One image per job, by build-image.yml. By default it builds on GitHub's
  # runners into GHCR; with BUILD_IMAGE=local it runs a fork's own build
  # action, images/local/build (a copy of examples/build), on the fork's
  # runners into its registry. That action is loaded only when it runs, so
  # this repo needs none of its own.
  build:
    needs: [decide, base]
    if: needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write   # a fork's build signing in to a cloud registry through OIDC
    strategy:
      # One image failing shouldn't stop the others shipping.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.decide.outputs.images) }}
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      sha: ${{ needs.base.outputs.sha }}
      date_tag: ${{ needs.decide.outputs.date_tag }}
      short_sha: ${{ needs.base.outputs.short_sha }}

  # One table and one images.json for the whole run, from what each build
  # recorded. The release is made only when every image is pushed.
  summary:
    needs: [decide, base, build]
    if: always() && needs.decide.outputs.build == 'true' && needs.base.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IMAGES: ${{ needs.decide.outputs.images }}
      DATE_TAG: ${{ needs.decide.outputs.date_tag }}
      TAG: ${{ needs.decide.outputs.date_tag }}-${{ needs.base.outputs.short_sha }}
      BASE: ${{ needs.base.outputs.base }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # images.json, for anything that picks images up by script:
      #   {"tag": "<YYYY.MM.DD>", "base": "<FROM>",
      #    "images": {"<image>": "ghcr.io/gitopsmanager/<image>@sha256:..."}}
      # Read the newest with:
      #   gh release download --repo gitopsmanager/runner-images --pattern images.json
      - name: Digest table and images.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/digests/*.json)
          if [ "${#files[@]}" -gt 0 ]; then jq -s 'add' "${files[@]}" > "$RUNNER_TEMP/all.json"; else echo '{}' > "$RUNNER_TEMP/all.json"; fi
          {
            echo "## Runner images, tag \`$TAG\`"
            echo
            echo "| Image | Pin as |"
            echo "|---|---|"
            for image in $(tr -d '[]"' <<<"$IMAGES" | tr ',' ' '); do
              ref=$(jq -r --arg k "$image" '.[$k] // empty' "$RUNNER_TEMP/all.json")
              if [ -n "$ref" ]; then
                echo "| \`$image\` | \`$ref\` |"
              else
                echo "| \`$image\` | not pushed (see its build job) |"
              fi
            done
          } | tee "$RUNNER_TEMP/table.md" >> "$GITHUB_STEP_SUMMARY"
          jq --arg tag "$DATE_TAG" --arg base "$BASE" '{tag: $tag, base: $base, images: .}' \
            "$RUNNER_TEMP/all.json" > "$RUNNER_TEMP/images.json"
          cat "$RUNNER_TEMP/images.json"

      - name: Release
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "Base: \`$BASE\`"
            echo
            cat "$RUNNER_TEMP/table.md"
            echo
            echo "Pin an image by its digest. The same digests, for scripts: \`images.json\` below. Tools and their versions: \`images/common/versions.env\` at this tag."
            echo
            echo "> **These images are never patched.** Security fixes come only in newer builds, about every 15 days. Move to the newest release at least monthly. Each image keeps its 6 newest builds (about 3 months); older digests are deleted and can no longer be pulled."
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$DATE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$DATE_TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$DATE_TAG" --repo "$REPO" --verify-tag --title "Runner images $DATE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$DATE_TAG" "$RUNNER_TEMP/images.json" --repo "$REPO" --clobber
