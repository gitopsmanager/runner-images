#
# A FORK'S OWN BUILD. This repo created this file once and never changes it,
# so editing it in a fork never conflicts with "Sync fork".
#
# Runs instead of build-image.yml when the repository variable
# BUILD_IMAGE=local is set. As shipped it does what build-image.yml does
# (GitHub's runners, GHCR); change it to build on your own runners into your
# own registry, for example:
#   runs-on: [self-hosted, <your ARC runner set>]
#   a sign-in to ECR/ACR/Artifact Registry with the runner's own identity
#   your build action, e.g. gitopsmanager/multicloud-build-action
#
# Keep the inputs below, and give back what the release needs: an artifact
# named digest-<image> holding {"<image>": "<registry>/<image>@sha256:..."}.
# The smoke test is inside each Dockerfile, so any builder runs it.
name: build-image-local

on:
  workflow_call:
    inputs:
      image:
        description: The folder under images/ (and the image's name).
        type: string
        required: true
      sha:
        description: The commit to build.
        type: string
        required: true
      date_tag:
        type: string
        required: true
      short_sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ inputs.image }}
      DATE_TAG: ${{ inputs.date_tag }}
      SHORT_SHA: ${{ inputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # ghcr.io/<owner>: ours is gitopsmanager, a fork's is its own org.
      # Registries want lower case.
      - name: Image address
        id: addr
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step: the build runs each Dockerfile's test stage (the smoke
      # test) before the image stage, so a failing test pushes nothing.
      # provenance and sbom off: they turn each push into an index with
      # untagged child manifests, which the pruning below would count and
      # could delete out from under a kept image.
      - name: Build, test and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}-${{ inputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.date_tag }}

      # What the release needs back from every build-image.yml, ours or a
      # fork's.
      - name: Record the digest
        env:
          REF: ${{ steps.addr.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          jq -n --arg image "$IMAGE" --arg ref "$REF@$DIGEST" '{($image): $ref}' > "$RUNNER_TEMP/digest/$IMAGE.json"
          echo "### $IMAGE: \`$REF@$DIGEST\` (tags \`$DATE_TAG\`, \`$DATE_TAG-$SHORT_SHA\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}
          path: ${{ runner.temp }}/digest/${{ inputs.image }}.json
          retention-days: 7

      # Keep the six newest versions of this package (three months at two
      # builds a month), delete the rest. A version is one pushed digest, so
      # both tags of a build count once.
      - name: Prune old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.image }}
          package-type: container
          min-versions-to-keep: 6
