#
# Builds, tests and pushes ONE image. Called by build-runner-images.yml once
# per images/runner* folder; everything else -- the schedule, the base
# update, the tag, the release -- is that workflow's.
#
# Two ways to build, by the repository variable BUILD_IMAGE:
#   not set  ours: GitHub's runners, GHCR at ghcr.io/<repo owner>, pruned to
#            the six newest versions.
#   local    a fork's own: the action at images/local/build, on the runner
#            RUNNER_LABELS names, into the fork's registry. The fork copies
#            examples/build to images/local/build and edits it there.
#            GitHub loads that action only when its step runs, so this repo
#            needs none; and images/local/ is never written by this repo, so
#            a fork's action never conflicts on a sync.
# A fork should NOT edit this file: it changes here.
#
# The smoke test is inside each Dockerfile, so whichever builder runs it.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: The folder under images/ (and the image's name).
        type: string
        required: true
      sha:
        description: The commit to build.
        type: string
        required: true
      date_tag:
        type: string
        required: true
      short_sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write   # used only by a fork's build signing in through OIDC

jobs:
  build:
    # A label or a JSON list; GitHub's runner unless a fork sets one.
    runs-on: ${{ fromJSON(startsWith(vars.RUNNER_LABELS || '', '[') && vars.RUNNER_LABELS || format('["{0}"]', vars.RUNNER_LABELS || 'ubuntu-24.04')) }}
    env:
      IMAGE: ${{ inputs.image }}
      DATE_TAG: ${{ inputs.date_tag }}
      SHORT_SHA: ${{ inputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # ── ours: GHCR ───────────────────────────────────────────────────────
      # ghcr.io/<owner>: ours is gitopsmanager, a fork's is its own org.
      # Registries want lower case.
      - name: Image address
        if: vars.BUILD_IMAGE != 'local'
        id: addr
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - if: vars.BUILD_IMAGE != 'local'
        uses: docker/setup-buildx-action@v4

      - if: vars.BUILD_IMAGE != 'local'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step: the build runs each Dockerfile's test stage (the smoke
      # test) before the image stage, so a failing test pushes nothing.
      # provenance and sbom off: they turn each push into an index with
      # untagged child manifests, which the pruning below would count and
      # could delete out from under a kept image.
      - name: Build, test and push
        if: vars.BUILD_IMAGE != 'local'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}-${{ inputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.date_tag }}

      # ── a fork's: images/local/build ─────────────────────────────────────
      # It gets the image and the tag, and gives back where it pushed (ref)
      # and the digest. Its settings come from the fork's repository
      # variables, passed here as environment so the action can read them.
      - name: Build, test and push (local)
        if: vars.BUILD_IMAGE == 'local'
        id: local
        uses: ./images/local/build
        with:
          image: ${{ inputs.image }}
          tag: ${{ inputs.date_tag }}-${{ inputs.short_sha }}
        env:
          AWS_IMAGE_REGISTRY: ${{ vars.AWS_IMAGE_REGISTRY }}
          AZURE_IMAGE_REGISTRY: ${{ vars.AZURE_IMAGE_REGISTRY }}
          IMAGE_REPOSITORY_PREFIX: ${{ vars.IMAGE_REPOSITORY_PREFIX }}
          AWS_ECR_OIDC_ROLE_ARN: ${{ vars.AWS_ECR_OIDC_ROLE_ARN }}
          AZURE_ACR_OIDC_CLIENT_ID: ${{ vars.AZURE_ACR_OIDC_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

      # ── both: what the release needs ─────────────────────────────────────
      - name: Record the digest
        env:
          REF: ${{ steps.addr.outputs.ref || steps.local.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest || steps.local.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && -n "$REF" ]] || { echo "::error::The build gave back no ref or digest (ref '$REF', digest '$DIGEST')"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digest"
          jq -n --arg image "$IMAGE" --arg ref "$REF@$DIGEST" '{($image): $ref}' > "$RUNNER_TEMP/digest/$IMAGE.json"
          echo "### $IMAGE: \`$REF@$DIGEST\` (tags \`$DATE_TAG\`, \`$DATE_TAG-$SHORT_SHA\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}
          path: ${{ runner.temp }}/digest/${{ inputs.image }}.json
          retention-days: 7

      # Ours only: keep the six newest versions of this package (three months
      # at two builds a month), delete the rest. A version is one pushed
      # digest, so both tags of a build count once. A fork's registry keeps
      # its own (an ECR lifecycle policy, ACR retention).
      - name: Prune old versions
        if: vars.BUILD_IMAGE != 'local'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.image }}
          package-type: container
          min-versions-to-keep: 6
