#
# Builds, tests and pushes ONE image. Called by build-runner-images.yml once
# per images/runner-* folder; everything else -- the schedule, the base
# update, the tag, the release -- is that workflow's.
#
# A fork should NOT edit this file (it changes here, so edits would conflict
# on a sync). To build on its own runners into its own registry, a fork copies
# examples/build-image.local.yml to .github/workflows/build-image.local.yml,
# edits that, and sets BUILD_IMAGE=local. Both files take
# the same inputs and give back the same thing: an artifact named
# digest-<image> holding {"<image>": "<registry>/<image>@sha256:..."}.
#
# This one: GitHub's runners, GHCR at ghcr.io/<repo owner>, prune to the six
# newest versions.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: The folder under images/ (and the image's name).
        type: string
        required: true
      sha:
        description: The commit to build.
        type: string
        required: true
      date_tag:
        type: string
        required: true
      short_sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ inputs.image }}
      DATE_TAG: ${{ inputs.date_tag }}
      SHORT_SHA: ${{ inputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # ghcr.io/<owner>: ours is gitopsmanager, a fork's is its own org.
      # Registries want lower case.
      - name: Image address
        id: addr
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step: the build runs each Dockerfile's test stage (the smoke
      # test) before the image stage, so a failing test pushes nothing.
      # provenance and sbom off: they turn each push into an index with
      # untagged child manifests, which the pruning below would count and
      # could delete out from under a kept image.
      - name: Build, test and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}
            ${{ steps.addr.outputs.ref }}:${{ inputs.date_tag }}-${{ inputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.date_tag }}

      # What the release needs back from every build-image.yml, ours or a
      # fork's.
      - name: Record the digest
        env:
          REF: ${{ steps.addr.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          jq -n --arg image "$IMAGE" --arg ref "$REF@$DIGEST" '{($image): $ref}' > "$RUNNER_TEMP/digest/$IMAGE.json"
          echo "### $IMAGE: \`$REF@$DIGEST\` (tags \`$DATE_TAG\`, \`$DATE_TAG-$SHORT_SHA\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}
          path: ${{ runner.temp }}/digest/${{ inputs.image }}.json
          retention-days: 7

      # Keep the six newest versions of this package (three months at two
      # builds a month), delete the rest. A version is one pushed digest, so
      # both tags of a build count once.
      - name: Prune old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.image }}
          package-type: container
          min-versions-to-keep: 6
